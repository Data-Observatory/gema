# LLM Provider configurations
# Each entry specifies how to connect to an LLM API endpoint.
# Reference from agents.yaml via the provider name.
providers:
  - name: zai-coding-plan
    api_key_env: ZAI_API_KEY
    base_url: https://api.z.ai/api/coding/paas/v4
    seed: 42
    default: true

  - name: opencode
    api_key_env: OPENCODE_API_KEY
    base_url: https://opencode.ai/zen/go/v1
    default: false
    # No tight account rate limit observed (confirmed empirically: 5
    # concurrent agent calls against opencode:deepseek-v4-flash produced
    # zero 429s). zai-coding-plan has no override here — it inherits the
    # global max_workers default in config/agents.yaml, tuned down for its
    # tighter limit (see that file's own comment + git blame on commit
    # 4101ac9).
    max_workers: 5
    # OpenCode notice (2026-09-03): requests missing this header may start
    # erroring on 09/06. Must be a fresh, stable-per-conversation ID (their
    # words) -- a static value defeats their per-conversation optimization,
    # so this names the header only; the value is generated fresh per LLM
    # call in llm/instructor_client.py's _build_extra_headers.
    session_header: x-opencode-session
    # Kept in sync with the same override in config/agents.yaml's real
    # inlined providers: block (the load-bearing one) so this autofill
    # preset stays a truthful copy of it. See that file's comment for the
    # full rationale (500 on chat_completions, works on the Responses API,
    # forced tool_choice rejected there too).
    model_overrides:
    - model: muse-spark-1.3-contributor
      api_style: responses
      reasoning_effort: medium

  - name: openai
    api_key_env: OPENAI_API_KEY
    base_url: null
    default: false

  - name: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: null
    default: false

  - name: openrouter
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    default: false
