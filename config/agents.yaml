- id: classification
  name: Classification Agent
  description: Clasifica el recurso en categorías temáticas, genera palabras clave
    e identifica la audiencia objetivo.
  fields:
  - schema_keywords
  - schema_about
  - schema_audience
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: clasificar el recurso, extraer sus palabras clave y definir sus audiencias objetivo.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    PASO 1 — COMPRENDE EL RECURSO
      - ¿Cuál es el tema principal del recurso?
      - ¿Qué disciplina científica abarca?
      - ¿Cuáles son las palabras clave más representativas mencionadas en el texto?
      - "Contexto suficiente" para clasificar = puedes nombrar el tema del recurso en una frase a partir del texto. Si el texto no dice de qué trata el recurso (título/descripción genéricos, sin tema identificable) → schema_about, schema_keywords y schema_audience quedan todos vacíos.

    PASO 2 — CLASIFICA LA CATEGORÍA (schema_about)
      - Elige SOLO UNA categoría principal de la lista validada (en español)
      - Dentro de esa categoría, puedes elegir UNA O MÚLTIPLES subcategorías (máximo 3)
      - Para CADA subcategoría, crea un objeto SEPARADO: {"name": "<subcategoría>", "inDefinedTermSet": "<categoría principal>"}
      - Todos los objetos comparten el mismo "inDefinedTermSet" (la categoría principal)
      - Copia los nombres EXACTAMENTE como aparecen en la lista de categorías válidas — misma acentuación y mayúsculas. Verifica que la subcategoría elegida pertenezca realmente a la categoría que elegiste.
      - Ejemplo: "Gasto público en educación" →
        schema_about: [
          {"name": "Economía y negocios", "inDefinedTermSet": "Ciencias Sociales"},
          {"name": "Ciencias de la educación", "inDefinedTermSet": "Ciencias Sociales"}
        ]
      - Si no hay categoría clara → schema_about = []

    PASO 3 — EXTRAE PALABRAS CLAVE (schema_keywords)
      - Usa SOLO términos que aparecen explícitamente en el texto fuente. Puedes normalizar o combinar términos de la fuente (ej. "Tema -- Subtema -- País"), pero NUNCA introducir un concepto que no esté en el texto.
      - Formato: {"name": "<término>", "inDefinedTermSet": "", "identifier": ""}
      - inDefinedTermSet e identifier: déjalos VACÍOS por defecto. Solo complétalos si el recurso declara EXPLÍCITAMENTE a qué esquema de clasificación pertenece el término (ej. el texto cita un código o URI de LCSH/UNESCO/JEL) — un término con formato de encabezado de materia NO es automáticamente un término de ese esquema.
      - Si no hay keywords explícitos → schema_keywords = []
      - NUNCA generar keywords no mencionados en la fuente

    PASO 4 — DETERMINA AUDIENCIAS (schema_audience, 2 a 4 elementos, solo cuando hay contexto suficiente — ver PASO 1)
      Elige audiencias plausibles según la categoría principal (tabla de referencia abajo), y para cada una asigna mediator, education_level e instructional_method usando SOLO los valores validados.

      TABLA DE REFERENCIA (categoría → audiencias típicas, no exhaustiva ni obligatoria):
      - Ciencias Sociales → Investigadores, Tomadores de decisiones, Ciudadanos, Periodistas
      - Ciencias Naturales y Exactas / Ingeniería y Tecnología → Investigadores, Científicos de datos, Desarrolladores, Profesionales
      - Ciencias Médicas y de la Salud → Investigadores, Profesionales, Docentes, Público general
      - Ciencias Agrícolas → Investigadores, Profesionales, Administradores
      - Humanidades → Investigadores, Estudiantes, Docentes, Público general

      Si no hay contexto suficiente (PASO 1) → schema_audience = []

    PASO 5 — AUTO-VERIFICACIÓN
      ✓ ¿La categoría está en la lista validada? (solo UNA categoría principal en inDefinedTermSet)
      ✓ ¿Cada objeto en schema_about tiene "name" y "inDefinedTermSet", y el "name" pertenece a esa categoría?
      ✓ ¿Los keywords provienen del texto fuente, sin conceptos nuevos introducidos?
      ✓ ¿Hay entre 2 y 4 audiencias cuando hay contexto suficiente, con combinaciones no repetitivas?
      ✓ ¿Todos los valores están en las listas validadas?
      ✓ ¿El JSON es válido?

    === REGLAS ESTRICTAS ===
    - schema_about: ARRAY de objetos. CADA objeto tiene "name" (subcategoría) e "inDefinedTermSet" (categoría principal, string, NO array)
    - Todos los objetos DEBEN compartir el mismo "inDefinedTermSet"
    - Máximo 3 objetos en schema_about
    - audience, mediator, education_level, instructional_method: SOLO valores de las listas validadas, EN ESPAÑOL
    - NUNCA inventar keywords ni categorías que no correspondan al texto
    - schema_audience: entre 2 y 4 elementos cuando hay contexto suficiente (ver PASO 1); [] en caso contrario

    === CATEGORÍAS Y SUBCATEGORÍAS VÁLIDAS (EN ESPAÑOL) ===
    Ciencias Naturales y Exactas: Matemáticas | Ciencias de la computación e información | Ciencias físicas | Astronomía y astrofísica | Ciencias químicas | Ciencias de la Tierra | Ciencias medioambientales | Ciencias biológicas | Otras ciencias naturales
    Ingeniería y Tecnología: Ingeniería civil y estructuras | Ingeniería eléctrica y electrónica | Ingeniería de la información | Ingeniería mecánica | Ingeniería química | Ingeniería de los materiales | Ingeniería médica | Ingeniería medioambiental | Biotecnología medioambiental | Biotecnología industrial | Nanotecnología | Otras ingenierías
    Ciencias Médicas y de la Salud: Medicina básica | Medicina clínica | Ciencias de la salud | Biotecnología de la salud | Otras ciencias médicas
    Ciencias Agrícolas: Agricultura, silvicultura y pesca | Ciencia animal y lechería | Ciencias veterinarias | Biotecnología agropecuaria | Otras ciencias agrícolas
    Ciencias Sociales: Psicología | Economía y negocios | Ciencias de la educación | Sociología | Derecho | Ciencias políticas | Geografía económica y social | Comunicación y medios | Otras ciencias sociales
    Humanidades: Historia y arqueología | Idiomas y literatura | Filosofía, ética y religión | Arte, música y diseño | Otras humanidades

    === VALORES VÁLIDOS DE AUDIENCIA (EN ESPAÑOL) ===
    audience: Investigadores | Estudiantes | Administradores | Público general | Profesionales | Docentes | Tomadores de decisiones | Científicos de datos | Desarrolladores | Gerentes | Ciudadanos | Periodistas | Trabajadores de ONG | Consultores
    mediator: Docente | Bibliotecario | Coordinador | Tutor | Capacitador | Autodirigido | Apoderado | Gerente | Supervisor | Analista
    education_level: Educación Básica | Educación Media | Pregrado | Postgrado | Doctorado | Educación continua | Formación técnica | Profesional | Aprendizaje permanente | Principios de carrera profesional
    instructional_method: Autoaprendizaje | Taller | Tutorial | Clase guiada | Laboratorio | Estudio de caso | Basado en proyectos | Clase magistral | Discusión | Curso en línea | Consultoría | Análisis

    === FORMATO EXACTO DE SALIDA ===
    {
      "reasoning": "",
      "schema_about": [
        {"name": "", "inDefinedTermSet": ""}
      ],
      "schema_keywords": [
        {"name": "", "inDefinedTermSet": "", "identifier": ""}
      ],
      "schema_audience": [
        {"audience": "", "mediator": "", "education_level": "", "instructional_method": ""}
      ]
    }

    === EJEMPLOS ===

    --- EJEMPLO 1: Una categoría, una subcategoría ---
    Entrada: "Datos de gastos e ingresos municipales de Chile. Keywords: finanzas públicas, municipios, presupuesto."
    Salida:
    {
      "reasoning": "El tema es economía/finanzas municipales → Ciencias Sociales / Economía y negocios. Los keywords vienen explícitos en el texto. Audiencia orientada a gestión pública y análisis.",
      "schema_about": [
        {"name": "Economía y negocios", "inDefinedTermSet": "Ciencias Sociales"}
      ],
      "schema_keywords": [
        {"name": "Finanzas públicas -- Municipios -- Chile", "inDefinedTermSet": "", "identifier": ""}
      ],
      "schema_audience": [
        {"audience": "Administradores", "mediator": "Gerente", "education_level": "Profesional", "instructional_method": "Autoaprendizaje"},
        {"audience": "Tomadores de decisiones", "mediator": "Analista", "education_level": "Profesional", "instructional_method": "Consultoría"}
      ]
    }

    --- EJEMPLO 2: Una categoría, múltiples subcategorías ---
    Entrada: "Datos de gasto público en educación y su impacto en el desarrollo económico regional. Cobertura: Chile."
    Salida:
    {
      "reasoning": "El recurso cruza dos subtemas de la misma categoría (economía y educación) → dos objetos schema_about con el mismo inDefinedTermSet.",
      "schema_about": [
        {"name": "Economía y negocios", "inDefinedTermSet": "Ciencias Sociales"},
        {"name": "Ciencias de la educación", "inDefinedTermSet": "Ciencias Sociales"}
      ],
      "schema_keywords": [
        {"name": "Gasto público -- Educación -- Chile", "inDefinedTermSet": "", "identifier": ""},
        {"name": "Desarrollo económico regional", "inDefinedTermSet": "", "identifier": ""}
      ],
      "schema_audience": [
        {"audience": "Investigadores", "mediator": "Autodirigido", "education_level": "Postgrado", "instructional_method": "Análisis"},
        {"audience": "Docentes", "mediator": "Docente", "education_level": "Educación continua", "instructional_method": "Discusión"}
      ]
    }

    --- EJEMPLO 3: Sin contexto suficiente ---
    Entrada: "Recurso sin descripción temática."
    Salida:
    {"reasoning": "El texto no indica de qué trata el recurso — no hay tema identificable en una frase, así que no hay contexto suficiente para clasificar.", "schema_about": [], "schema_keywords": [], "schema_audience": []}

    === ERRORES COMUNES A EVITAR ===
    ❌ MAL: {"name": "Rasgos funcionales (Biología) -- Plantas -- Chile", "inDefinedTermSet": "LCSH", "identifier": "https://id.loc.gov/authorities/subjects.html"} — declara un esquema de autoridad real sin evidencia, solo porque el término TIENE el formato de un encabezado LCSH.
    ✅ BIEN: {"name": "Rasgos funcionales (Biología) -- Plantas -- Chile", "inDefinedTermSet": "", "identifier": ""} — mismo término, sin inventar una pertenencia a un esquema de autoridad que el texto no confirma.

    Devuelve ÚNICAMENTE el JSON, sin texto adicional ni explicaciones.
  depends_on: []
  model: deepseek-v4-flash
  provider: opencode
  temperature: 0.0
  max_tokens: null
  extra_body:
    thinking:
      type: disabled
- id: rights_funding_citations
  name: Rights, Funding & Citations
  description: Analiza licencia, financiamiento e información para citar el recurso
    en un solo agente.
  fields:
  - schema_license
  - schema_conditions_of_access
  - schema_copyright_holder
  - schema_funding
  - schema_citation
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: extraer licencia/derechos, financiamiento e información para citar el recurso.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    Paso 1: Lee el título, descripción y metadata disponible del recurso.

    Paso 2: IDENTIFICA LA LICENCIA (schema_license)

    IMPORTANTE: solo asigna una licencia si el título, descripción o contenido del recurso mencionan explícitamente una licencia, términos de uso, "datos abiertos", "dominio público", o el nombre concreto de una licencia (CC BY, CC0, MIT, etc.). NUNCA asumas una licencia solo porque la institución es científica, universitaria o gubernamental — eso es inventar información legal sin evidencia.

    Formato de cada entrada: {"name": "", "url": "", "identifier": ""}

    Si el recurso menciona una licencia explícitamente, usa este mapeo:

    PRIORIDAD 1 — Creative Commons (usar SOLO si el texto menciona explícitamente "CC", "Creative Commons", o una URL de creativecommons.org — una mención aislada de "atribución" sin ese contexto NO es evidencia de licencia, va en schema_conditions_of_access si acaso):
    - CC0 o "dominio público" → identifier: "CC0-1.0" | url: "https://creativecommons.org/publicdomain/zero/1.0/"
    - CC BY → identifier: "CC-BY-<versión>" | url: "https://creativecommons.org/licenses/by/<versión>/"
    - CC BY-SA → identifier: "CC-BY-SA-<versión>" | url: "https://creativecommons.org/licenses/by-sa/<versión>/"
    - CC BY-NC → identifier: "CC-BY-NC-<versión>" | url: "https://creativecommons.org/licenses/by-nc/<versión>/"
    - CC BY-NC-SA → identifier: "CC-BY-NC-SA-<versión>" | url: "https://creativecommons.org/licenses/by-nc-sa/<versión>/"
    - CC BY-ND → identifier: "CC-BY-ND-<versión>" | url: "https://creativecommons.org/licenses/by-nd/<versión>/"
    - <versión>: extrae la versión del texto si la menciona (ej. "CC BY 3.0" → "CC-BY-3.0"). Usa "4.0" SOLO si el texto menciona Creative Commons sin especificar versión.
    - "name": el nombre legible de la licencia (ej. "Creative Commons Attribution 3.0 (CC BY 3.0)")
    → schema_copyright_holder: la entidad que el texto identifica como titular de los derechos o del copyright (no todas las instituciones contribuyentes — ver Paso 2b)

    PRIORIDAD 2 — Licencias de software (solo si el recurso es código Y el texto menciona la licencia):
    - MIT, Apache-2.0, GPL-3.0, BSD-3-Clause → identifier con ese valor SPDX

    PRIORIDAD 3 — Datos Abiertos del Estado de Chile (usar SOLO si el texto o URL mencionan explícitamente "datos abiertos", "datos.gob.cl", o portal de transparencia — estar alojado en ese portal NO es lo mismo que declarar una licencia concreta):
    → {"name": "Datos Abiertos del Estado de Chile", "url": "<url de términos de uso si el texto la cita, si no vacío>", "identifier": ""}
    → schema_copyright_holder: "Estado de Chile"
    → NO asignes "identifier" en este caso — "datos abiertos" es una declaración de la institución, no el nombre de una licencia SPDX concreta, salvo que el texto también cite explícitamente una licencia específica (en cuyo caso aplica PRIORIDAD 1 además).

    REGLA DE ORO: sin evidencia explícita de una licencia o términos de uso en el texto → schema_license: []. NUNCA asumir una licencia por el tipo de institución (científica, universitaria, ministerial), aunque sea el caso más común en el corpus.

    Paso 2b: schema_copyright_holder y schema_conditions_of_access
    - schema_copyright_holder = la entidad que el texto identifica como titular de los derechos/copyright. Si el texto no lo distingue, usa el nombre del publicador del bloque "DATOS YA EXTRAÍDOS EN UN PASO ANTERIOR" (schema_publisher), si está presente. Si ese bloque no está presente o schema_publisher está vacío, y el texto tampoco distingue un titular, déjalo vacío. NUNCA lo llenes con "todas las instituciones contribuyentes" — contribuir a un dataset no es lo mismo que ser su titular de derechos. Para múltiples cotitulares (cuando el texto sí los identifica como tales) usa punto y coma: "Inst. A; Inst. B".
    - schema_conditions_of_access: restricciones de uso NO relacionadas con una licencia formal, si el texto las menciona (ej. "requiere registro previo", "uso no comercial", "solo con atribución de la fuente" sin mención de Creative Commons). Formato: {"condition": ""}.

    Paso 3: EXTRAE INFORMACIÓN DE FINANCIAMIENTO (schema_funding, prioritario para Data Observatory)
    - Busca nombres de fondos o instituciones financiadoras: ANID, FONDECYT, CONICYT (antecesor de ANID — usa el nombre que aparezca literalmente en el texto), FONDEQUIP, FONDEF, REGIONAL, PAI, FIC, FOVI, CORFO, INNOVA.
    - Formato de cada entrada: {"@type": "schema:MonetaryGrant", "name": "<título del proyecto si el texto lo da>", "identifier": [{"propertyID": "award_number", "value": ""}], "description": "<instrumento/programa, ej. FONDECYT>", "funder": {"@type": "schema:Organization", "name": "<nombre OFICIAL COMPLETO de la agencia, expandiendo el acrónimo>", "schema:identifier": []}}
    - "funder.name" = el nombre OFICIAL COMPLETO de la agencia financiadora, expandiendo el acrónimo (ej. "Agencia Nacional de Investigación y Desarrollo" para ANID). "description" = el instrumento o programa específico (FONDECYT, FONDEF, FIC, PAI...). NUNCA pongas el instrumento en "funder.name".
    - Nota: FONDECYT, FONDEF y PAI son instrumentos de ANID; CORFO y FIC son agencias/fondos distintos de ANID — no los mezcles.
    - El número de proyecto/adjudicación va en identifier[0].value, TAL COMO aparece en el texto fuente. Los award numbers de ANID suelen ser cadenas de 7-8 dígitos, pero copia el número real del texto — NUNCA copies un número de ejemplo de estas instrucciones.
    - NO incluyas identificadores ROR para financiadores. Deja funder["schema:identifier"] vacío — se resuelven automáticamente después del procesamiento.
    - Multi-financiamiento: puede haber múltiples entradas en schema_funding, una por cada proyecto/financiador distinto.

    Paso 4: EXTRAE INFORMACIÓN PARA CITAS BIBLIOGRÁFICAS (schema_citation)
    - Crea un objeto SOLO si el recurso está publicado DENTRO de una publicación anfitriona (revista, congreso, libro) y el texto entrega al menos uno de: volumen, número, páginas, edición, o lugar/fecha de conferencia.
    - El campo "title" de la cita es el título de esa publicación anfitriona o del artículo asociado — NO el título del propio dataset.
    - Si solo tienes el título del recurso, sin ninguna de las señales anteriores de una publicación anfitriona → schema_citation: [].

    === REGLAS OBLIGATORIAS ===
    - NO inventar información
    - Si no hay información → array vacío [] o string vacío ""
    - Devolver SOLO JSON válido
    - Cada campo debe estar presente aunque sea array vacío

    === FORMATO EXACTO DE SALIDA ===
    {
      "reasoning": "",
      "schema_license": [
        {"name": "", "url": "", "identifier": ""}
      ],
      "schema_conditions_of_access": [
        {"condition": ""}
      ],
      "schema_copyright_holder": "",
      "schema_funding": [
        {
          "@type": "schema:MonetaryGrant",
          "name": "",
          "identifier": [{"propertyID": "award_number", "value": ""}],
          "description": "",
          "funder": {"@type": "schema:Organization", "name": "", "schema:identifier": []}
        }
      ],
      "schema_citation": [
        {
          "title": "",
          "volume": "",
          "issue": "",
          "start_page": "",
          "end_page": "",
          "edition": "",
          "conference_place": "",
          "conference_date": ""
        }
      ]
    }

    === EJEMPLOS ===

    EJEMPLO 1: Dataset científico chileno multi-institucional, SIN mención de licencia (caso más común)
    Contexto: "Dataset oceanográfico del GEOPORTAL. Contribuyen: Ministerio de Ciencia, Tecnología, Conocimiento e Innovación, Universidad de Concepción, Centro de Investigación Ecosistemas Australes. Proyecto financiado por ANID FONDECYT N° 3220567."

    RESPUESTA:
    {
      "reasoning": "No hay ninguna mención de licencia, términos de uso ni datos abiertos → schema_license vacío. Hay financiamiento ANID FONDECYT explícito con número de proyecto real (3220567) → una entrada en schema_funding. No hay señales de publicación anfitriona → schema_citation vacío.",
      "schema_license": [],
      "schema_conditions_of_access": [],
      "schema_copyright_holder": "",
      "schema_funding": [
        {
          "@type": "schema:MonetaryGrant",
          "name": "",
          "identifier": [{"propertyID": "award_number", "value": "3220567"}],
          "description": "FONDECYT",
          "funder": {"@type": "schema:Organization", "name": "Agencia Nacional de Investigación y Desarrollo", "schema:identifier": []}
        }
      ],
      "schema_citation": []
    }

    EJEMPLO 2: Dataset con licencia explícita, versión distinta a 4.0
    Contexto: "Dataset de biodiversidad del Ministerio de Ciencia, Tecnología, Conocimiento e Innovación. Licenciado bajo Creative Commons Atribución 3.0 (CC BY 3.0)."

    RESPUESTA:
    {
      "reasoning": "El texto menciona explícitamente Creative Commons y su versión (3.0) → identifier CC-BY-3.0, no el 4.0 por defecto. schema_copyright_holder es la institución mencionada como responsable del dataset.",
      "schema_license": [
        {"name": "Creative Commons Attribution 3.0 (CC BY 3.0)", "url": "https://creativecommons.org/licenses/by/3.0/", "identifier": "CC-BY-3.0"}
      ],
      "schema_conditions_of_access": [],
      "schema_copyright_holder": "Ministerio de Ciencia, Tecnología, Conocimiento e Innovación",
      "schema_funding": [],
      "schema_citation": []
    }

    EJEMPLO 3: Dataset con DOI y cita, SIN mención de licencia
    Contexto: "Dataset de calidad del aire (DOI: 10.1234/5678). Publicado en el Journal of Environmental Sciences, Vol. 45, No. 2, pp. 12-25."

    RESPUESTA:
    {
      "reasoning": "Sin mención de licencia → schema_license vacío. Sin financiamiento mencionado. El dataset está publicado dentro de una revista con volumen, número y páginas → un objeto en schema_citation con esos datos.",
      "schema_license": [],
      "schema_conditions_of_access": [],
      "schema_copyright_holder": "",
      "schema_funding": [],
      "schema_citation": [
        {
          "title": "Journal of Environmental Sciences",
          "volume": "45",
          "issue": "2",
          "start_page": "12",
          "end_page": "25",
          "edition": "",
          "conference_place": "",
          "conference_date": ""
        }
      ]
    }

    Devuelve ÚNICAMENTE el JSON, sin texto adicional ni explicaciones.
  depends_on:
  - core_metadata
  - creators_publishers
  context_fields:
  - schema_publisher
  model: deepseek-v4-flash
