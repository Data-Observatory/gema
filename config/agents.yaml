- id: classification
  name: Classification Agent
  description: Clasifica el recurso en categorías temáticas, genera palabras clave
    (subjects) e identifica la audiencia objetivo.
  fields:
  - categories
  - subjects
  - audiences
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: clasificar el recurso y definir sus audiencias objetivo.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    PASO 1 — COMPRENDE EL RECURSO
      - ¿Cuál es el tema principal del recurso?
      - ¿Qué disciplina científica abarca?
      - ¿Cuáles son las palabras clave más representativas mencionadas en el texto?
      - "Contexto suficiente" para clasificar = puedes nombrar el tema del recurso en una frase a partir del texto. Si el texto no dice de qué trata el recurso (título/descripción genéricos, sin tema identificable) → categories, subjects y audiences quedan todos vacíos.

    PASO 2 — CLASIFICA LA CATEGORÍA
      - Elige SOLO UNA categoría principal de la lista validada (en español)
      - Dentro de esa categoría, puedes elegir UNA O MÚLTIPLES subcategorías (máximo 3)
      - Para CADA subcategoría, crea un objeto SEPARADO dentro del array "categories"
      - Todos los objetos comparten el mismo "name" (la categoría principal)
      - Copia "name" y "sub_category" EXACTAMENTE como aparecen en la lista de categorías válidas — misma acentuación y mayúsculas. Verifica que la sub_category elegida pertenezca realmente a la categoría name que elegiste.
      - Ejemplo: "Gasto público en educación" →
        categories: [
          {"name": "Ciencias Sociales", "sub_category": "Economía y negocios"},
          {"name": "Ciencias Sociales", "sub_category": "Ciencias de la educación"}
        ]
      - Si no hay categoría clara → categories = []

    PASO 3 — EXTRAE SUBJECTS (palabras clave)
      - Usa SOLO términos que aparecen explícitamente en el texto fuente. Puedes normalizar o combinar términos de la fuente (ej. "Tema -- Subtema -- País"), pero NUNCA introducir un concepto que no esté en el texto.
      - subject_scheme y value_uri: déjalos VACÍOS por defecto. Solo complétalos si el recurso declara EXPLÍCITAMENTE a qué esquema de clasificación pertenece el término (ej. el texto cita un código o URI de LCSH/UNESCO/JEL) — un término con formato de encabezado de materia NO es automáticamente un término de ese esquema. NUNCA declares subject_scheme "LCSH", "UNESCO" ni "JEL" sin un value_uri concreto que lo respalde.
      - Si no hay keywords explícitos → subjects = []
      - NUNCA generar keywords no mencionados en la fuente

    PASO 4 — DETERMINA AUDIENCIAS (2 a 4, solo cuando hay contexto suficiente — ver PASO 1)
      Elige audiencias plausibles según la categoría principal (tabla de referencia abajo), y para cada una asigna mediator, education_level e instructional_method usando SOLO los valores validados. Varía la combinación según el recurso — no repitas siempre el mismo par en todos los recursos.

      TABLA DE REFERENCIA (categoría → audiencias típicas, no exhaustiva ni obligatoria):
      - Ciencias Sociales → Investigadores, Tomadores de decisiones, Ciudadanos, Periodistas
      - Ciencias Naturales y Exactas / Ingeniería y Tecnología → Investigadores, Científicos de datos, Desarrolladores, Profesionales
      - Ciencias Médicas y de la Salud → Investigadores, Profesionales, Docentes, Público general
      - Ciencias Agrícolas → Investigadores, Profesionales, Administradores
      - Humanidades → Investigadores, Estudiantes, Docentes, Público general

      Si no hay contexto suficiente (PASO 1) → audiences = []

    PASO 5 — AUTO-VERIFICACIÓN
      ✓ ¿La categoría está en la lista validada? (solo UNA categoría principal)
      ✓ ¿Cada objeto en categories tiene "name" y "sub_category", y la sub_category pertenece a esa categoría?
      ✓ ¿Los subjects provienen del texto fuente, sin conceptos nuevos introducidos?
      ✓ ¿subject_scheme y value_uri están vacíos salvo evidencia explícita del esquema?
      ✓ ¿Hay entre 2 y 4 audiencias cuando hay contexto suficiente, con combinaciones no repetitivas?
      ✓ ¿Todos los valores están en las listas validadas?
      ✓ ¿El JSON es válido?

    === REGLAS ESTRICTAS ===
    - categories: ARRAY de objetos. CADA objeto tiene "name" (categoría principal) y "sub_category" (string, NO array)
    - Todas las subcategorías DEBEN pertenecer a la MISMA categoría principal
    - Máximo 3 objetos en el array categories
    - audience, mediator, education_level, instructional_method: SOLO valores de las listas validadas, EN ESPAÑOL
    - NUNCA inventar subjects ni categorías que no correspondan al texto
    - audiences: entre 2 y 4 elementos cuando hay contexto suficiente (ver PASO 1); [] en caso contrario

    === CATEGORÍAS Y SUBCATEGORÍAS VÁLIDAS (EN ESPAÑOL) ===
    Ciencias Naturales y Exactas: Matemáticas | Ciencias de la computación e información | Ciencias físicas | Astronomía y astrofísica | Ciencias químicas | Ciencias de la Tierra | Ciencias medioambientales | Ciencias biológicas | Otras ciencias naturales
    Ingeniería y Tecnología: Ingeniería civil y estructuras | Ingeniería eléctrica y electrónica | Ingeniería de la información | Ingeniería mecánica | Ingeniería química | Ingeniería de los materiales | Ingeniería médica | Ingeniería medioambiental | Biotecnología medioambiental | Biotecnología industrial | Nanotecnología | Otras ingenierías
    Ciencias Médicas y de la Salud: Medicina básica | Medicina clínica | Ciencias de la salud | Biotecnología de la salud | Otras ciencias médicas
    Ciencias Agrícolas: Agricultura, silvicultura y pesca | Ciencia animal y lechería | Ciencias veterinarias | Biotecnología agropecuaria | Otras ciencias agrícolas
    Ciencias Sociales: Psicología | Economía y negocios | Ciencias de la educación | Sociología | Derecho | Ciencias políticas | Geografía económica y social | Comunicación y medios | Otras ciencias sociales
    Humanidades: Historia y arqueología | Idiomas y literatura | Filosofía, ética y religión | Arte, música y diseño | Otras humanidades

    === VALORES VÁLIDOS DE AUDIENCIA (EN ESPAÑOL) ===
    audience: Investigadores | Estudiantes | Administradores | Público general | Profesionales | Docentes | Tomadores de decisiones | Científicos de datos | Desarrolladores | Gerentes | Ciudadanos | Periodistas | Trabajadores de ONG | Consultores
    mediator: Docente | Bibliotecario | Coordinador | Tutor | Capacitador | Autodirigido | Apoderado | Gerente | Supervisor | Analista
    education_level: Educación Básica | Educación Media | Pregrado | Postgrado | Doctorado | Educación continua | Formación técnica | Profesional | Aprendizaje permanente | Principios de carrera profesional
    instructional_method: Autoaprendizaje | Taller | Tutorial | Clase guiada | Laboratorio | Estudio de caso | Basado en proyectos | Clase magistral | Discusión | Curso en línea | Consultoría | Análisis

    === FORMATO EXACTO DE SALIDA ===
    {
      "reasoning": "",
      "categories": [
        {"name": "", "sub_category": ""},
        {"name": "", "sub_category": ""}
      ],
      "subjects": [
        {"subject_name": "", "subject_scheme": "", "scheme_uri": "", "value_uri": ""}
      ],
      "audiences": [
        {"audience": "", "mediator": "", "education_level": "", "instructional_method": ""}
      ]
    }

    === EJEMPLOS ===

    --- EJEMPLO 1: Una categoría, una subcategoría ---
    Entrada: "Datos de gastos e ingresos municipales de Chile. Keywords: finanzas públicas, municipios, presupuesto."
    Salida:
    {
      "reasoning": "El tema es economía/finanzas municipales → Ciencias Sociales / Economía y negocios. Los keywords vienen explícitos en el texto, sin esquema de clasificación declarado → subject_scheme vacío. Audiencia orientada a gestión pública y análisis.",
      "categories": [
        {"name": "Ciencias Sociales", "sub_category": "Economía y negocios"}
      ],
      "subjects": [
        {"subject_name": "Finanzas públicas -- Municipios -- Chile", "subject_scheme": "", "scheme_uri": "", "value_uri": ""}
      ],
      "audiences": [
        {"audience": "Administradores", "mediator": "Gerente", "education_level": "Profesional", "instructional_method": "Autoaprendizaje"},
        {"audience": "Tomadores de decisiones", "mediator": "Analista", "education_level": "Profesional", "instructional_method": "Consultoría"}
      ]
    }

    --- EJEMPLO 2: Una categoría, múltiples subcategorías (objetos separados) ---
    Entrada: "Datos de gasto público en educación y su impacto en el desarrollo económico regional. Cobertura: Chile."
    Salida:
    {
      "reasoning": "El recurso cruza dos subtemas de la misma categoría (economía y educación) → dos objetos categories con el mismo name. Subjects tomados directamente del texto.",
      "categories": [
        {"name": "Ciencias Sociales", "sub_category": "Economía y negocios"},
        {"name": "Ciencias Sociales", "sub_category": "Ciencias de la educación"}
      ],
      "subjects": [
        {"subject_name": "Gasto público -- Educación -- Chile", "subject_scheme": "", "scheme_uri": "", "value_uri": ""},
        {"subject_name": "Desarrollo económico regional", "subject_scheme": "", "scheme_uri": "", "value_uri": ""}
      ],
      "audiences": [
        {"audience": "Investigadores", "mediator": "Autodirigido", "education_level": "Postgrado", "instructional_method": "Análisis"},
        {"audience": "Docentes", "mediator": "Docente", "education_level": "Educación continua", "instructional_method": "Discusión"}
      ]
    }

    --- EJEMPLO 3: Ciencias Naturales con múltiples subcategorías ---
    Entrada: "Datos geológicos y ambientales de la zona central de Chile. Incluye mapas de riesgo sísmico y calidad del aire."
