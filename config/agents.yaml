- id: media_files
  name: Media Files
  description: 'Describe los archivos multimedia del recurso: formato, tamaño, URI,
    variable medida, calidad y procedencia de los datos.'
  fields:
  - schema_distribution
  - schema_variable_measured
  - schema_measurement_technique
  - dqv_quality_measurement
  - prov_generated_by
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: describir los archivos descargables del recurso y, si el texto lo permite, la variable medida, técnica de medición, calidad de los datos y procedencia.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    Paso 1: Lee el título, descripción y metadata disponible del recurso.

    Paso 2: IDENTIFICA EL O LOS ARCHIVOS DESCARGABLES (schema_distribution)
    - Busca URLs de descarga (archivos, APIs, servicios web) en el texto. Si NO hay ninguna URL de descarga real, NO crees ningún objeto — un objeto sin contentUrl no tiene sentido.
    - Para CADA URL, determina su formato IANA (tipo MIME) a partir de:
      a) La extensión del archivo en la URL (.kml, .kmz, .zip, .csv, .json, .tif, .pdf, etc.)
      b) La descripción explícita en el texto (ej. "formato KML", "archivo CSV")
      c) El tipo MIME si está escrito (ej. "application/zip", "text/csv")
      d) El patrón de la URL si corresponde a un servicio REST o OGC conocido:
         - GetCapabilities en la URL → formato: "application/xml"
         - URL con /rest/services/ terminada en /MapServer, /FeatureServer o /ImageServer (ArcGIS REST) → formato: "application/json"
         - URL con /arcgis/rest/ → formato: "application/json"
         - URL con /wms o WMSServer → formato: "image/png"
         - URL con /wfs o WFSServer → formato: "application/json"
      e) REGLA POR DEFECTO CONDICIONADA: usa "application/zip" ÚNICAMENTE si hay una URL de descarga real Y el texto sugiere un paquete de datos (shapefile, capa, "descargar", múltiples archivos comprimidos) pero ninguna de las vías anteriores determina el formato. Si hay URL pero ninguna pista de formato ni indicio de paquete comprimido, deja "encodingFormat" vacío en vez de asumir ZIP.
    - Formato de cada entrada: {"contentUrl": "", "encodingFormat": "", "contentSize": [], "checksum": "", "temporal_resolution": ""}
    - contentSize: {"size": numero, "unit": "bytes|KB|MB|GB"} SOLO si el texto menciona el peso; si no, [].
    - checksum (MD5, SHA-1, SHA-256) si está en el texto.
    - temporal_resolution (daily, monthly, yearly, hourly) si está en el texto.
    - Detecta si hay múltiples archivos o uno solo — crea un objeto SEPARADO por cada URL de descarga encontrada.

    Paso 3: METADATOS DEL CONTENIDO (a nivel del recurso, no por archivo — solo si están explícitamente en el texto)
    - schema_variable_measured: [{"name": "<variable medida>"}], una entrada por variable distinta mencionada.
    - schema_measurement_technique: ["<técnica>"], lista de strings.
    - dqv_quality_measurement: [{"measure": "<qué se midió de la calidad>", "value": "<resultado, si el texto lo da>"}]
    - prov_generated_by: {"description": "<procedencia o instrumentación de los datos>"} — un solo objeto, no una lista.
    - Si el texto no menciona ninguno de estos → dejar la lista/objeto vacío correspondiente.

    === REGLAS OBLIGATORIAS ===
    - **CAMPO OBLIGATORIO:** "schema_distribution" SIEMPRE debe existir en la salida JSON, aunque sea []. NUNCA lo omitas.
    - NO inventar información
    - Si no hay archivos descargables → schema_distribution: []
    - NUNCA crear un objeto en schema_distribution sin contentUrl
    - Si un campo no tiene información en el texto → dejar "" (string vacío) o [] (array vacío)
    - Devolver SOLO JSON válido

    === FORMATO EXACTO DE SALIDA ===
    {
      "reasoning": "",
      "schema_distribution": [
        {
          "contentUrl": "",
          "encodingFormat": "",
          "contentSize": [],
          "checksum": "",
          "temporal_resolution": ""
        }
      ],
      "schema_variable_measured": [],
      "schema_measurement_technique": [],
      "dqv_quality_measurement": [],
      "prov_generated_by": {}
    }

    === EJEMPLOS ===

    EJEMPLO 1: Dataset en KML con peso
    Contexto: "Capa de concesiones. URL: https://datos.gob.cl/concesiones.kml. Peso 2.5 MB. Datos del Ministerio de Bienes Nacionales."

    RESPUESTA:
    {
      "reasoning": "Hay una URL de descarga real con extensión .kml → formato KML determinado por extensión. Peso mencionado explícitamente. Procedencia institucional explícita → prov_generated_by.",
      "schema_distribution": [
        {
          "contentUrl": "https://datos.gob.cl/concesiones.kml",
          "encodingFormat": "application/vnd.google-earth.kml+xml",
          "contentSize": [{"size": 2.5, "unit": "MB"}],
          "checksum": "",
          "temporal_resolution": ""
        }
      ],
      "schema_variable_measured": [],
      "schema_measurement_technique": [],
      "dqv_quality_measurement": [],
      "prov_generated_by": {"description": "Datos del Ministerio de Bienes Nacionales"}
    }

    EJEMPLO 2: Servicio ArcGIS REST (MapServer)
    Contexto: "Visor de Obras MOP. URL: https://rest-sit.mop.gob.cl/arcgis/rest/services/DGOP/VISOR_OBRA_MOP/MapServer."

    RESPUESTA:
    {
      "reasoning": "La URL coincide con el patrón ArcGIS REST /arcgis/rest/.../MapServer → formato application/json por patrón conocido, sin peso mencionado.",
      "schema_distribution": [
        {
          "contentUrl": "https://rest-sit.mop.gob.cl/arcgis/rest/services/DGOP/VISOR_OBRA_MOP/MapServer",
          "encodingFormat": "application/json",
          "contentSize": [],
          "checksum": "",
          "temporal_resolution": ""
        }
      ],
      "schema_variable_measured": [],
      "schema_measurement_technique": [],
      "dqv_quality_measurement": [],
      "prov_generated_by": {}
    }

    EJEMPLO 3: Sin archivos descargables
    Contexto: "Página web informativa sin archivos descargables ni URLs de descarga."

    RESPUESTA:
    {"reasoning": "No hay ninguna URL de descarga en el texto → no se crea ningún objeto.", "schema_distribution": [], "schema_variable_measured": [], "schema_measurement_technique": [], "dqv_quality_measurement": [], "prov_generated_by": {}}

    === ERRORES COMUNES A EVITAR ===
    ❌ MAL: {"encodingFormat": "application/zip", "contentUrl": ""} — crear un objeto sin ninguna URL real, solo para "completar" el default.
    ✅ BIEN: si no hay URL de descarga real, no crear el objeto — schema_distribution: [].

    Devuelve ÚNICAMENTE el JSON, sin texto adicional ni explicaciones.
  depends_on: []
  model: deepseek-v4-flash
  provider: opencode
  temperature: 0.0
  max_tokens: null
  extra_body:
    thinking:
      type: disabled
providers:
- name: openrouter
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  default: false
- name: openai
  api_key_env: OPENAI_API_KEY
- name: opencode
  api_key_env: OPENCODE_API_KEY
  base_url: https://opencode.ai/zen/go/v1
  default: true
  # No tight account rate limit observed (confirmed empirically: 5
  # concurrent agent calls against opencode:deepseek-v4-flash produced
  # zero 429s). zai-coding-plan has no override -- it inherits the global
  # max_workers default below, tuned down for its tighter limit.
  max_workers: 5
  # OpenCode notice (2026-09-03): requests missing this header may start
  # erroring on 09/06. Must be a fresh, stable-per-conversation ID (their
  # words) -- a static value defeats their per-conversation optimization,
  # so this names the header only; the value is generated fresh per LLM
  # call in llm/instructor_client.py's _build_extra_headers.
  session_header: x-opencode-session
- name: anthropic
  api_key_env: ANTHROPIC_API_KEY
- name: zai-coding-plan
  api_key_env: ZAI_API_KEY
  base_url: https://api.z.ai/api/coding/paas/v4
  seed: 42
  default: false
default_provider: opencode
# Max concurrent agent requests per resource (Orchestrator's ThreadPoolExecutor
# size) when no provider/model override applies. Kept conservative because
# zai-coding-plan's actual rate limit is tight enough that even 2 concurrent
# requests trigger 429 bursts (measured live) — this is the safe fallback for
# it or any future provider without its own override. Production now runs on
# opencode, which has its own `max_workers: 5` override above (confirmed safe
# empirically, zero 429s) that takes precedence over this global default via
# PipelineConfig.effective_max_workers's cascade. Override per-invocation with
# `gema process --max-workers N`.
max_workers: 1
# Post-merge resolution of ROR/ISNI/ORCID identifiers for schema:creator/
# schema:publisher/schema:funding that the LLM left blank (prompts
# intentionally no longer supply a hardcoded lookup table — see PASO 4 in
# the creators_publishers prompt).
enable_identifier_enrichment: true
# Fetches each resource's URL and feeds page text to agents as extra context.
# Enabled 2026-08-15 after a 20-item scale eval on current prod (opencode/
# deepseek-v4-flash, max_workers 5) showed 40/40 succeeded with zero stalls/
# timeouts and a net +0.022 structural quality gain (see BACKLOG.md). Known
# gap: fetch_page_content doesn't isolate main content from nav/boilerplate,
# so a rare page can dilute rather than help (BACKLOG.md's media_formats
# entry).
enable_content_fetch: true
