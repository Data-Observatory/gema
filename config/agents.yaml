    === ERRORES COMUNES A EVITAR ===
    ❌ MAL: {"subject_name": "Rasgos funcionales (Biología) -- Plantas -- Chile", "subject_scheme": "LCSH", "scheme_uri": "https://id.loc.gov/authorities/subjects.html", "value_uri": ""} — declara un esquema de autoridad real sin ningún value_uri que lo respalde, solo porque el término TIENE el formato de un encabezado LCSH.
    ✅ BIEN: {"subject_name": "Rasgos funcionales (Biología) -- Plantas -- Chile", "subject_scheme": "", "scheme_uri": "", "value_uri": ""} — mismo término, sin inventar una pertenencia a un esquema de autoridad que el texto no confirma.

    Devuelve ÚNICAMENTE el JSON, sin texto adicional ni explicaciones.
