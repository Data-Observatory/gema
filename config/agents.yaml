- id: creators_publishers
  name: Creators and Publishers
  description: Extrae los creadores (con identificadores ISNI/ROR y afiliaciones)
    y editores del recurso.
  fields:
  - creators
  - publishers
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: identificar y estructurar todos los creadores y publicadores mencionados en el contenido.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    PASO 1 — IDENTIFICA ACTORES INVOLUCRADOS
      - ¿Quién CREÓ o PRODUJO el contenido del recurso?
      - ¿Quién lo PUBLICÓ o lo mantiene disponible?
      - ¿Es una persona o una institución?
      - ¿Hay más de un creador o publicador?
      Lista mentalmente todos los actores antes de estructurarlos.

    PASO 2 — CLASIFICA CADA ACTOR
      Para cada actor identificado:
      a) ¿Es persona o institución?
         - Persona → name_type = "Personal", type = "Person", extraer given_name y family_name por separado. Formato de nombre completo en creator_name: "Apellido, Nombre" (ej. "Sarricolea, Pablo"; para apellidos compuestos, "Meseguer-Ruiz, Oliver"; respeta partículas como "de la", "van" como parte del apellido).
         - Institución → name_type = "Organizational", type = "Organization", creator_name = nombre completo oficial (con acentuación correcta).
      b) ¿Es creador (produjo el contenido) o publicador (lo distribuye)?
         - REGLA: para instituciones públicas chilenas, si el texto NO identifica un publicador distinto del creador, agrega la MISMA institución también en publishers (publisher_name = creator_name). Si el texto SÍ distingue un publicador diferente (ej. un portal, un departamento distinto que lo aloja), usa ese nombre en publishers en vez de duplicar.

    PASO 3 — IMPORTANTE SOBRE IDENTIFICADORES (LEER ATENTAMENTE)
      - NO incluyas identificadores ROR, ISNI u ORCID en los campos name_identifiers, affiliation_identifier o publisher_identifier/publisher_scheme_uri.
      - Deja name_identifiers como lista vacía ([]) para instituciones.
      - Deja affiliation_identifier y affiliation_identifier_scheme como string vacío ("").
      - Deja publisher_identifier, publisher_identifier_scheme y publisher_scheme_uri como string vacío ("").
      - Los identificadores se resolverán automáticamente después del procesamiento mediante APIs oficiales (ROR, ISNI). Un campo con un esquema declarado pero sin valor real (ej. name_identifier_scheme: "ROR" con name_identifier: "") es peor que dejarlo vacío — invita a que se rellene con un ID inventado.
      - ENFÓCATE en extraer los NOMBRES correctos de instituciones y su estructura jerárquica de afiliaciones.

    PASO 4 — DETERMINA AFILIACIONES RESPETANDO LA JERARQUÍA
      REGLA FUNDAMENTAL: la afiliación debe ser el organismo INMEDIATAMENTE superior en la jerarquía, nunca saltar niveles.
      La cadena jerárquica del Estado chileno es: Servicio/Corporación/Oficina → Ministerio del que depende → Gobierno de Chile.

      PATRONES GENERALES (aplícalos por nombre, sin necesidad de tabla):
      - "Municipalidad de X" → affiliation = "" (entidad autónoma, no depende de un ministerio)
      - "Gobierno Regional de X" → affiliation = "" (entidad autónoma)
      - "SEREMI de <área>" (ej. "SEREMI de Salud", "SEREMI de Vivienda") → affiliation = el ministerio correspondiente a esa área (ej. SEREMI de Salud → "Ministerio de Salud")
      - "Servicio de Salud X" → affiliation = "Ministerio de Salud"
      - "Delegación Presidencial (Regional/Provincial)" → affiliation = "Ministerio del Interior y Seguridad Pública"
      - "Departamento/Facultad/Centro de <Universidad>" → creator = la unidad específica (ej. "Departamento de Geografía, Universidad de Chile"); affiliation = "" (las universidades son entidades independientes, sin afiliación superior)
      - Cualquier Ministerio → affiliation = "Gobierno de Chile"

      EXCEPCIONES (siglas cuya afiliación no es derivable del nombre — memorízalas):
      - ODEPA → affiliation = "Ministerio de Agricultura"
      - CONAF → affiliation = "Ministerio de Agricultura"
      - SERNATUR → affiliation = "Ministerio de Economía, Fomento y Turismo"
      - INE → affiliation = "Ministerio de Economía, Fomento y Turismo"
      - SENAME → affiliation = "Ministerio de Justicia y Derechos Humanos"
      - JUNJI → affiliation = "Ministerio de Educación"
      - SII → affiliation = "Ministerio de Hacienda"
      - DIFROL → affiliation = "Ministerio de Relaciones Exteriores"
      - Carabineros → affiliation = "Ministerio del Interior y Seguridad Pública"
      - SHOA → affiliation = "Armada de Chile" (rama distinta de la cadena ministerial habitual — no tiene ministerio intermedio)
      - BCN (Biblioteca del Congreso Nacional) → affiliation = "Congreso Nacional de Chile" (Poder Legislativo, no depende de un ministerio)

      OTROS CASOS:
      - Persona → affiliation = la institución donde trabaja, si el texto la menciona
      - Sin información suficiente → affiliations = []

    === REGLAS ESTRICTAS ===
    - **CAMPO OBLIGATORIO:** creator_name SIEMPRE debe tener un valor NO vacío para cada objeto en creators
    - **CAMPO OBLIGATORIO:** publisher_name SIEMPRE debe tener un valor NO vacío para cada objeto en publishers
    - La afiliación SIEMPRE es el organismo inmediatamente superior, nunca saltar niveles jerárquicos
    - Si no hay creadores ni publicadores → {"creators": [], "publishers": []}

