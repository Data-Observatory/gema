- id: media_files
  name: Media Files
  description: 'Describe los archivos multimedia del recurso: formato, tamaño, URI,
    procedencia, título y descripción.'
  fields:
  - media_files
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: describir los archivos descargables y datasets asociados al recurso.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    Paso 1: Lee el título, descripción y metadata disponible del recurso.

    Paso 2: IDENTIFICA EL O LOS ARCHIVOS DESCARGABLES
    - Busca URLs de descarga (archivos, APIs, servicios web) en el texto. Si NO hay ninguna URL de descarga real, NO crees ningún objeto en media_files — un objeto con file_uri vacío no tiene sentido.
    - Para CADA URL, determina su formato IANA (tipo MIME) a partir de:
      a) La extensión del archivo en la URL (.kml, .kmz, .zip, .csv, .json, .tif, .pdf, etc.)
      b) La descripción explícita en el texto (ej. "formato KML", "archivo CSV")
      c) El tipo MIME si está escrito (ej. "application/zip", "text/csv")
      d) El patrón de la URL si corresponde a un servicio REST o OGC conocido:
         - GetCapabilities en la URL → formato: "application/xml"
         - URL con /rest/services/ terminada en /MapServer, /FeatureServer o /ImageServer (ArcGIS REST) → formato: "application/json"
         - URL con /arcgis/rest/ → formato: "application/json"
         - URL con /wms o WMSServer → formato: "image/png"
         - URL con /wfs o WFSServer → formato: "application/json"
      e) REGLA POR DEFECTO CONDICIONADA: usa "application/zip" ÚNICAMENTE si hay una URL de descarga real Y el texto sugiere un paquete de datos (shapefile, capa, "descargar", múltiples archivos comprimidos) pero ninguna de las vías anteriores determina el formato. Si hay URL pero ninguna pista de formato ni indicio de paquete comprimido, deja "format" vacío en vez de asumir ZIP.
    - Detecta si hay múltiples archivos o un solo archivo — crea un objeto SEPARADO por cada URL de descarga encontrada.

    Paso 3: OBTIENE EL PESO/TAMAÑO DEL ARCHIVO
    - Busca en el texto menciones de peso (ej. "2.5 MB", "450 KB", "1.2 GB")
    - Si NO se menciona el peso → sizes = []
    - Formato del peso: {"size": numero, "unit": "bytes|KB|MB|GB"}

    Paso 4: EXTRAE INFORMACIÓN TÉCNICA DE CADA ARCHIVO
    - Checksum (MD5, SHA-1, SHA-256) si está en el texto
    - Resolución temporal (daily, monthly, yearly, hourly) si está en el texto

    Paso 5: EXTRAE METADATOS DEL CONTENIDO
    - Variable medida, técnica de medición, calidad de los datos, procedencia: solo si están explícitamente en el texto

    === REGLAS OBLIGATORIAS ===
    - **CAMPO OBLIGATORIO:** el campo "media_files" SIEMPRE debe existir en la salida JSON, aunque sea []. NUNCA lo omitas.
    - NO inventar información
    - Si no hay archivos descargables → {"media_files": []}
    - NUNCA crear un objeto en media_files con file_uri vacío
    - Si un campo no tiene información en el texto → dejar "" (string vacío) o [] (array vacío)
    - Devolver SOLO JSON válido
    - El campo "format" debe usar el tipo MIME IANA que corresponda según la extensión, descripción o patrón de URL del archivo

    === FORMATO EXACTO DE SALIDA ===
    {
      "reasoning": "",
      "media_files": [
        {
          "sizes": [],
          "physical_carrier": "digital",
          "format": "",
          "variable_measured": "",
          "checksum": "",
          "data_quality": "",
          "measurement_technique": "",
          "provenance": "",
          "file_uri": "",
          "temporal_resolution": ""
        }
      ]
    }

    === EJEMPLOS ===

    EJEMPLO 1: Dataset en KML con peso
    Contexto: "Capa de concesiones. URL: https://datos.gob.cl/concesiones.kml. Peso 2.5 MB. Datos del Ministerio de Bienes Nacionales."

