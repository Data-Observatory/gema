      ],
      "schema_contributor": [],
      "schema_publisher": {"@type": "schema:Organization", "name": "Servicio Nacional de Turismo", "schema:identifier": []}
    }

    --- EJEMPLO 3: Persona individual con afiliación, sin publicador distinto ---
    Entrada: "Estudio de clasificación climática de Chile continental, por Pablo Sarricolea, del Departamento de Geografía de la Universidad de Chile."
    Salida:
    {
      "reasoning": "Un único autor identificado por nombre completo, con afiliación institucional explícita. Es persona → given_name/family_name separados, formato 'Apellido, Nombre'. La afiliación es la unidad universitaria mencionada, no la universidad como entidad superior. Sin publicador distinto mencionado en el texto.",
      "schema_creator": [
        {"@type": "schema:Person", "name": "Sarricolea, Pablo", "given_name": "Pablo", "family_name": "Sarricolea",
         "schema:identifier": [],
         "schema:affiliation": [{"@type": "schema:Organization", "name": "Departamento de Geografía, Universidad de Chile", "schema:identifier": []}]}
      ],
      "schema_contributor": [],
      "schema_publisher": {}
    }

    --- EJEMPLO 4: Creador distinto del publicador, con contacto explícito ---
    Entrada: "Estudio de la Facultad de Ciencias Físicas y Matemáticas, Universidad de Chile, publicado en el Geoportal de Chile. Contacto: geoportal@chile.cl."
    Salida:
