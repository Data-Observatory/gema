    EJEMPLO 5: URL de descarga sin pistas de formato, pero con indicio de paquete de datos (aplica el default condicionado)
    Contexto: "Datos geográficos. URL de descarga: https://datos.gob.cl/recurso/descargar?id=12345. Peso 3.7 MB. Descarga el paquete completo de capas. Fuente: Ministerio de Obras Públicas."

