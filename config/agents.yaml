# Max concurrent agent requests per resource (Orchestrator's ThreadPoolExecutor
# size). zai-coding-plan's actual rate limit is tight enough that even 2
# concurrent requests trigger 429 bursts (measured live) — serialize agent
# calls to respect it reliably. Raise this if a less rate-limited provider
# is configured. Override per-invocation with `metagen process --max-workers N`.
max_workers: 1
