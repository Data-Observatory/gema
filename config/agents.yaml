- id: rights_funding_citations
  name: Rights, Funding & Citations
  description: Analiza licencia, financiamiento e información para citar el recurso
    en un solo agente.
  fields:
  - rights
  - funding_references
  - citations
  system_prompt: *shared_system_prompt
  prompt: |
    Tu tarea: extraer licencia/derechos, financiamiento e información para citar el recurso.

    === PASOS DE ANÁLISIS (resume tu razonamiento en "reasoning" antes de responder) ===

    Paso 1: Lee el título, descripción y metadata disponible del recurso.

    Paso 2: IDENTIFICA LA LICENCIA O DERECHOS DEL RECURSO

    IMPORTANTE: solo asigna una licencia si el título, descripción o contenido del recurso mencionan explícitamente una licencia, términos de uso, "datos abiertos", "dominio público", o el nombre concreto de una licencia (CC BY, CC0, MIT, etc.). NUNCA asumas una licencia solo porque la institución es científica, universitaria o gubernamental — eso es inventar información legal sin evidencia y viola la regla de no inventar información.

    Si el recurso menciona una licencia explícitamente, usa este mapeo:

    PRIORIDAD 1 — Creative Commons (usar SOLO si el texto menciona explícitamente "CC", "Creative Commons", o una URL de creativecommons.org — una mención aislada de "atribución" sin ese contexto NO es evidencia de licencia, va en rights_condition si acaso):
    - CC0 o "dominio público" → rights_identifier: "CC0-1.0" | rights_uri: "https://creativecommons.org/publicdomain/zero/1.0/"
    - CC BY → rights_identifier: "CC-BY-<versión>" | rights_uri: "https://creativecommons.org/licenses/by/<versión>/"
    - CC BY-SA → rights_identifier: "CC-BY-SA-<versión>" | rights_uri: "https://creativecommons.org/licenses/by-sa/<versión>/"
    - CC BY-NC → rights_identifier: "CC-BY-NC-<versión>" | rights_uri: "https://creativecommons.org/licenses/by-nc/<versión>/"
    - CC BY-NC-SA → rights_identifier: "CC-BY-NC-SA-<versión>" | rights_uri: "https://creativecommons.org/licenses/by-nc-sa/<versión>/"
    - CC BY-ND → rights_identifier: "CC-BY-ND-<versión>" | rights_uri: "https://creativecommons.org/licenses/by-nd/<versión>/"
    - <versión>: extrae la versión del texto si la menciona (ej. "CC BY 3.0" → "CC-BY-3.0"). Usa "4.0" SOLO si el texto menciona Creative Commons sin especificar versión.
    → rights_identifier_scheme: "SPDX" | scheme_uri: "https://spdx.org/licenses/"
    → rights_holder: la entidad que el texto identifica como titular de los derechos o del copyright (no todas las instituciones contribuyentes — ver Paso 2b)

    PRIORIDAD 2 — Licencias de software (solo si el recurso es código Y el texto menciona la licencia):
    - MIT, Apache-2.0, GPL-3.0, BSD-3-Clause
    → rights_identifier_scheme: "SPDX" | scheme_uri: "https://spdx.org/licenses/"

    PRIORIDAD 3 — Datos Abiertos del Estado de Chile (usar SOLO si el texto o URL mencionan explícitamente "datos abiertos", "datos.gob.cl", o portal de transparencia — estar alojado en ese portal NO es lo mismo que declarar una licencia concreta):
    → rights: "Datos Abiertos del Estado de Chile"
    → rights_holder: "Estado de Chile"
    → rights_uri: la URL de la página de términos de uso citada en el texto, si existe; si no hay ninguna, déjalo vacío
    → NO asignes rights_identifier ni rights_identifier_scheme en este caso — "datos abiertos" es una declaración de la institución, no el nombre de una licencia SPDX concreta, salvo que el texto también cite explícitamente una licencia específica (en cuyo caso aplica PRIORIDAD 1 además).

    REGLA DE ORO: sin evidencia explícita de una licencia o términos de uso en el texto → "rights": []. NUNCA asumir una licencia por el tipo de institución (científica, universitaria, ministerial), aunque sea el caso más común en el corpus.

    Paso 2b: rights_holder y rights_condition
    - rights_holder = la entidad que el texto identifica como titular de los derechos/copyright. Si el texto no lo distingue, usa el publicador. Si tampoco hay publicador identificado, déjalo vacío. NUNCA lo llenes con "todas las instituciones contribuyentes" — contribuir a un dataset no es lo mismo que ser su titular de derechos.
    - rights_condition: restricciones de uso NO relacionadas con una licencia formal, si el texto las menciona (ej. "requiere registro previo", "uso no comercial", "solo con atribución de la fuente" sin mención de Creative Commons).
    - start_date: fecha en que la licencia/término entró en vigencia, SOLO si el texto la menciona explícitamente.

    Paso 3: EXTRAE INFORMACIÓN DE FINANCIAMIENTO (prioritario para Data Observatory)
    - Busca nombres de fondos o instituciones financiadoras: ANID, FONDECYT, CONICYT (antecesor de ANID — usa el nombre que aparezca literalmente en el texto), FONDEQUIP, FONDEF, REGIONAL, PAI, FIC, FOVI, CORFO, INNOVA.
    - funder_name = el nombre OFICIAL COMPLETO de la agencia financiadora, expandiendo el acrónimo (ej. "Agencia Nacional de Investigación y Desarrollo" para ANID). funding_stream = el instrumento o programa específico (FONDECYT, FONDEF, FIC, PAI...). NUNCA pongas el instrumento en funder_name.
    - Nota: FONDECYT, FONDEF y PAI son instrumentos de ANID; CORFO y FIC son agencias/fondos distintos de ANID — no los mezcles.
    - award_number: el número de proyecto/adjudicación TAL COMO aparece en el texto fuente. Los award numbers de ANID suelen ser cadenas de 7-8 dígitos, pero copia el número real del texto — NUNCA copies un número de ejemplo de estas instrucciones.
    - NO incluyas identificadores ROR para financiadores. Deja funder_identifier vacío — se resuelven automáticamente después del procesamiento.
    - Multi-financiamiento: puede haber múltiples funding_references, uno por cada proyecto/financiador distinto.

    Paso 4: EXTRAE INFORMACIÓN PARA CITAS BIBLIOGRÁFICAS
    - Crea un objeto en citations SOLO si el recurso está publicado DENTRO de una publicación anfitriona (revista, congreso, libro) y el texto entrega al menos uno de: volumen, número, páginas, edición, o lugar/fecha de conferencia.
    - El campo "title" de la cita es el título de esa publicación anfitriona o del artículo asociado — NO el título del propio dataset.
    - Si solo tienes el título del recurso, sin ninguna de las señales anteriores de una publicación anfitriona → citations: [].
    - Busca DOI cuando corresponda a la publicación (no al dataset en sí, salvo que sean el mismo objeto).

    === REGLAS OBLIGATORIAS ===
    - NO inventar información
    - Si no hay información → array vacío [] o string vacío ""
    - Para rights_holder con múltiples instituciones (cuando el texto sí las identifica como cotitulares) usar punto y coma: "Inst. A; Inst. B; Inst. C"
    - Devolver SOLO JSON válido
    - Cada campo debe estar presente aunque sea array vacío

    === FORMATO EXACTO DE SALIDA ===
    {
      "reasoning": "",
      "rights": [
        {
          "rights": "",
          "start_date": "",
          "rights_uri": "",
          "rights_identifier": "",
          "rights_identifier_scheme": "",
          "scheme_uri": "",
          "rights_condition": "",
          "rights_holder": ""
        }
      ],
      "funding_references": [
        {
          "funder_name": "",
          "funding_stream": "",
          "award_number": "",
          "award_uri": "",
          "award_title": "",
          "funder_identifiers": []
        }
      ],
      "citations": [
        {
          "title": "",
          "volume": "",
          "issue": "",
          "start_page": "",
          "end_page": "",
          "edition": "",
          "conference_place": "",
          "conference_date": ""
        }
      ]
    }

    === EJEMPLOS ===

    EJEMPLO 1: Dataset científico chileno multi-institucional, SIN mención de licencia (caso más común — la mayoría de recursos NO mencionan licencia explícitamente)
    Contexto: "Dataset oceanográfico del GEOPORTAL. Contribuyen: Ministerio de Ciencia, Tecnología, Conocimiento e Innovación, Universidad de Concepción, Centro de Investigación Ecosistemas Australes. Proyecto financiado por ANID FONDECYT N° 3220567."

    RESPUESTA:
    {
      "reasoning": "No hay ninguna mención de licencia, términos de uso ni datos abiertos → rights vacío. Hay financiamiento ANID FONDECYT explícito con número de proyecto real (3220567) → un funding_reference. No hay señales de publicación anfitriona → citations vacío.",
      "rights": [],
      "funding_references": [
        {
          "funder_name": "Agencia Nacional de Investigación y Desarrollo",
          "funding_stream": "FONDECYT",
          "award_number": "3220567",
          "award_uri": "",
          "award_title": "",
          "funder_identifiers": []
        }
      ],
      "citations": []
    }

    EJEMPLO 2: Dataset con licencia explícita, versión distinta a 4.0
    Contexto: "Dataset de biodiversidad del Ministerio de Ciencia, Tecnología, Conocimiento e Innovación. Licenciado bajo Creative Commons Atribución 3.0 (CC BY 3.0)."

    RESPUESTA:
    {
      "reasoning": "El texto menciona explícitamente Creative Commons y su versión (3.0) → rights_identifier CC-BY-3.0, no el 4.0 por defecto. rights_holder es la institución mencionada como responsable del dataset.",
      "rights": [
        {
          "rights": "Creative Commons Attribution 3.0 (CC BY 3.0)",
          "start_date": "",
          "rights_uri": "https://creativecommons.org/licenses/by/3.0/",
          "rights_identifier": "CC-BY-3.0",
          "rights_identifier_scheme": "SPDX",
          "scheme_uri": "https://spdx.org/licenses/",
          "rights_condition": "",
          "rights_holder": "Ministerio de Ciencia, Tecnología, Conocimiento e Innovación"
        }
      ],
      "funding_references": [],
      "citations": []
    }

    EJEMPLO 3: Dataset de portal de datos abiertos del Estado, sin licencia SPDX concreta
    Contexto: "Dataset de gastos municipales, disponible en datos.gob.cl como datos abiertos del Estado de Chile."

    RESPUESTA:
    {
      "reasoning": "El texto menciona explícitamente 'datos abiertos del Estado de Chile' → PRIORIDAD 3. No hay una licencia SPDX concreta citada (no dice 'CC BY' ni ninguna licencia con nombre), así que NO asigno rights_identifier — solo la etiqueta descriptiva y el titular.",
      "rights": [
        {
          "rights": "Datos Abiertos del Estado de Chile",
          "start_date": "",
          "rights_uri": "",
          "rights_identifier": "",
          "rights_identifier_scheme": "",
          "scheme_uri": "",
          "rights_condition": "",
          "rights_holder": "Estado de Chile"
        }
      ],
      "funding_references": [],
      "citations": []
    }

    EJEMPLO 4: Dataset con DOI y cita, SIN mención de licencia
    Contexto: "Dataset de calidad del aire (DOI: 10.1234/5678). Publicado en el Journal of Environmental Sciences, Vol. 45, No. 2, pp. 12-25."

    RESPUESTA:
    {
      "reasoning": "Sin mención de licencia → rights vacío. Sin financiamiento mencionado → funding_references vacío. El dataset está publicado dentro de una revista con volumen, número y páginas → un objeto en citations con esos datos de la publicación anfitriona.",
