    \ e Innovacion\"\n    }\n  ],\n  \"funding_references\": [],\n  \"citations\"\
    : []\n}\n\nEJEMPLO 3: Dataset con DOI y cita\nContexto: \"Dataset de calidad del\
    \ aire (DOI: 10.1234/5678). Publicado en el Journal of Environmental Sciences,\
