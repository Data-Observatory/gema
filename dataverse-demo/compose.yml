version: "2.4"

# Based verbatim on IQSS's official demo/evaluation compose file:
# https://github.com/IQSS/dataverse/blob/develop/docker/compose/demo/compose.yml
# (see ../doc/sphinx-guides/source/container/running/demo.rst in that repo for
# the full walkthrough this file follows).
#
# Three deliberate deviations from the vanilla file, all explained in README.md:
# 1. The "demo" persona is already selected (dev commented out, demo
#    uncommented, ./demo volume mount uncommented) - this is a multi-person
#    live demo, not a single-developer sandbox, so the more-secure persona
#    (no --insecure admin API) is the right default here, not an opt-in step.
# 2. BLOCKED_API_KEY is added to the bootstrap service's environment, sourced
#    from a .env file (gitignored) instead of hardcoded in demo/init.sh - the
#    official guide explicitly says to change this from "unblockme" to
#    something only you know; hardcoding a "secret" in a committed file
#    would defeat that entirely.
# 3. The stateful runtime data mounts (dataverse app data/secrets, postgres,
#    solr) use named Docker volumes instead of the vanilla file's `./data/...`
#    bind mounts. postgres and solr each chown their data directory to their
#    own uid at startup; a bind mount onto a host filesystem that can't do
#    real per-file chown (NTFS, exFAT, some network shares) makes them
#    crash-loop ("Operation not permitted"). Named volumes are Docker-managed
#    storage, unaffected by the host filesystem - works the same on every OS,
#    no host config needed. `./demo` stays a bind mount - it's a read-only
#    script directory, not runtime data, so it never needs chown.

services:

  dataverse:
    container_name: "dataverse"
    hostname: dataverse
    image: gdcc/dataverse:latest
    restart: on-failure
    user: payara
    environment:
      DATAVERSE_SITEURL: "http://${MACHINE_IP:-localhost}:8080"
      DATAVERSE_DB_HOST: postgres
      DATAVERSE_DB_PASSWORD: secret
      DATAVERSE_DB_USER: dataverse
      DATAVERSE_FEATURE_API_BEARER_AUTH: "1"
      DATAVERSE_MAIL_SYSTEM_EMAIL: "Demo Dataverse <dataverse@example.org>"
      DATAVERSE_MAIL_MTA_HOST: "smtp"
      JVM_ARGS: -Ddataverse.files.storage-driver-id=file1
        -Ddataverse.files.file1.type=file
        -Ddataverse.files.file1.label=Filesystem
        -Ddataverse.files.file1.directory=${STORAGE_DIR:-/dv}/store
        -Ddataverse.pid.providers=perma1
        -Ddataverse.pid.default-provider=perma1
        -Ddataverse.pid.perma1.type=perma
        -Ddataverse.pid.perma1.label=Perma1
        -Ddataverse.pid.perma1.authority=DV
        -Ddataverse.pid.perma1.permalink.separator=/
        #-Ddataverse.lang.directory=/dv/lang
    ports:
      - "8080:8080" # HTTP (Dataverse Application)
      - "4848:4848" # HTTP (Payara Admin Console)
      - "9009:9009" # JDWP
      - "8686:8686" # JMX
    networks:
      - dataverse
    depends_on:
      - postgres
      - solr
      - dv_initializer
    volumes:
      - dv_app_data:/dv
      - dv_app_secrets:/secrets
    tmpfs:
      - /dumps:mode=1777,size=2052M
      - /tmp:mode=1777,size=2052M
    mem_limit: 2147483648 # 2 GiB
    mem_reservation: 1024m
    privileged: false

  bootstrap:
    container_name: "bootstrap"
    image: gdcc/configbaker:latest
    restart: "no"
    environment:
      - TIMEOUT=3m
      - BLOCKED_API_KEY=${BLOCKED_API_KEY:-unblockme}
    command:
      #- bootstrap.sh
      #- dev
      - bootstrap.sh
      - demo
    volumes:
      - ./demo:/scripts/bootstrap/demo
    networks:
      - dataverse

  dv_initializer:
    container_name: "dv_initializer"
    image: gdcc/configbaker:latest
    restart: "no"
    command:
      - sh
      - -c
      - "fix-fs-perms.sh dv"
    volumes:
      - dv_app_data:/dv

  previewers-provider:
    image: trivadis/dataverse-previewers-provider:latest
    container_name: previewers-provider
    hostname: previewers-provider
    ports:
      - 9000:9000
    networks:
      - dataverse
    environment:
      - NGINX_HTTP_PORT=9000
      - PREVIEWERS_PROVIDER_URL=http://${MACHINE_IP:-localhost}:9000
      - VERSIONS="v1.4,betatest"

  register-previewers:
    container_name: register-previewers
    hostname: register-previewers
    image: trivadis/dataverse-deploy-previewers:latest
    networks:
      - dataverse
    environment:
      - DATAVERSE_URL=http://dataverse:8080
      - TIMEOUT=10m
      - PREVIEWERS_PROVIDER_URL=http://${MACHINE_IP:-localhost}:9000
      # Uncomment to specify which previewers you want. Otherwise you get all of them.
      #- INCLUDE_PREVIEWERS=text,html,pdf,csv,comma-separated-values,tsv,tab-separated-values,jpeg,png,gif,markdown,x-markdown
      - EXCLUDE_PREVIEWERS=
      - REMOVE_EXISTING=True
    command:
      - deploy
    restart: no

  postgres:
    container_name: "postgres"
    hostname: postgres
    image: postgres:17
    restart: on-failure
    environment:
      - POSTGRES_USER=dataverse
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    networks:
      - dataverse
    volumes:
      - dv_postgres_data:/var/lib/postgresql/data

  solr_initializer:
    container_name: "solr_initializer"
    image: gdcc/configbaker:latest
    restart: "no"
    command:
      - sh
      - -c
      - "fix-fs-perms.sh solr && cp -a /template/* /solr-template"
    volumes:
      - dv_solr_data:/var/solr
      - dv_solr_conf:/solr-template

  solr:
    container_name: "solr"
    hostname: "solr"
    image: solr:9.8.0
    depends_on:
      - solr_initializer
    restart: on-failure
    ports:
      - "8983:8983"
    environment:
      - SOLR_OPTS=-Dsolr.jetty.request.header.size=102400
    networks:
      - dataverse
    command:
      - "solr-precreate"
      - "collection1"
      - "/template"
    volumes:
      - dv_solr_data:/var/solr
      - dv_solr_conf:/template

  smtp:
    container_name: "smtp"
    hostname: "smtp"
    image: maildev/maildev:2.0.5
    restart: on-failure
    ports:
      - "25:25" # smtp server
      - "1080:1080" # web ui
    environment:
      - MAILDEV_SMTP_PORT=25
      - MAILDEV_MAIL_DIRECTORY=/mail
    networks:
      - dataverse
    #volumes:
    #  - ./data/smtp/data:/mail
    tmpfs:
      - /mail:mode=1777,size=128M

  uploader:
    container_name: "uploader"
    build: ./uploader
    restart: on-failure
    environment:
      - DATAVERSE_URL=http://dataverse:8080
      - DATAVERSE_API_TOKEN=${DATAVERSE_API_TOKEN:-}
      - DATAVERSE_COLLECTION_ALIAS=${DATAVERSE_COLLECTION_ALIAS:-root}
    ports:
      - "8090:8090"
    networks:
      - dataverse
    depends_on:
      - dataverse

networks:
  dataverse:
    driver: bridge

volumes:
  dv_app_data:
  dv_app_secrets:
  dv_postgres_data:
  dv_solr_data:
  dv_solr_conf:
