[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metadata-enricher"
version = "0.1.0"
description = "Multi-agent metadata enrichment library with pluggable schema support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Álvaro P.L." }]
dependencies = [
    "openai>=1.0.0",
    "instructor>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "diskcache>=5.6.0",
    "tenacity>=8.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
metagen = "metadata_enricher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_enricher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: requires real API keys",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
