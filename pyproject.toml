[project]
name = "metadata-enricher"
version = "0.1.0"
description = "DSPy multi-agent metadata enrichment system"
requires-python = ">=3.10"
dependencies = [
    "dspy-ai>=2.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
