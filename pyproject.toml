[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gema"
version = "0.1.0"
description = "Multi-agent metadata enrichment library with pluggable schema support"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Álvaro P.L." }]
dependencies = [
    "openai>=1.0.0",
    "instructor>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "diskcache>=5.6.0",
    "tenacity>=8.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "json-semantic-diff>=0.1.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "types-PyYAML>=6.0.0",
]
visor = [
    "nicegui>=1.4.0",
    "pywebview>=5.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
gema = "metadata_enricher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_enricher"]
artifacts = ["src/metadata_enricher/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: requires real API keys",
    "regression: golden-output cache-replay tests (no API key needed)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "diskcache.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "deepeval>=4.0.7",
]
visor-build = [
    "pyinstaller>=6.0",
]

